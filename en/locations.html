<!DOCTYPE html>
<html lang="bg" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="locations.title"></title>

    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/favicon-16x16.png">
    <link rel="manifest" href="images/favicons/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.2/dist/full.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gold': '#d4af37',
                        'dark-bg': '#0a0a0a',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .map-wrapper {
            position: relative;
            filter: grayscale(100%) contrast(1.1) brightness(0.7);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .map-wrapper:hover {
            filter: grayscale(0%) contrast(1) brightness(1);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }

        .map-overlay {
            background: linear-gradient(to bottom, #0a0a0a 0%, transparent 10%, transparent 90%, #0a0a0a 100%);
            pointer-events: none;
        }
    </style>
</head>

<body class="text-gray-200">

<style>
[data-i18n] {
    white-space: pre-line;
}
</style>


<nav class="p-6 border-b border-white/5 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
        <a href="index.html" class="text-gold hover:text-white transition-colors uppercase tracking-[0.2em] text-[10px] font-bold">
            <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="locations.nav_back"></span>
        </a>
        <span class="text-white font-bold tracking-tighter uppercase text-sm" data-i18n="locations.nav_brand"></span>
    </div>
</nav>

<section class="py-24">
    <div class="container mx-auto px-6">
        <div class="max-w-4xl mb-24">
            <h2 class="text-sm font-bold text-gold uppercase tracking-[0.4em] mb-4" data-i18n="locations.header_badge"></h2>
            <h1 class="text-5xl md:text-7xl font-bold text-white tracking-tight" data-i18n="locations.header_title"></h1>
        </div>

        <div class="space-y-32">
            
            <div class="flex flex-col lg:flex-row gap-16 items-center">
                <div class="lg:w-1/2">
                    <div class="w-12 h-1 bg-gold mb-8"></div>
                    <h2 class="text-4xl font-bold text-white mb-6 tracking-tight" data-i18n="locations.sz_title"></h2>
                    <p class="text-gray-400 text-lg mb-8 leading-relaxed max-w-md" data-i18n="locations.sz_desc"></p>
                    <div class="space-y-6">
                        <div class="flex items-center gap-6">
                            <i class="fas fa-calendar-day text-gold text-xl w-6"></i>
                            <div>
                                <p class="text-xs uppercase tracking-widest text-gray-500 font-bold" data-i18n="locations.label_day"></p>
                                <p class="text-white" data-i18n="locations.day_friday"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <i class="fas fa-clock text-gold text-xl w-6"></i>
                            <div>
                                <p class="text-xs uppercase tracking-widest text-gray-500 font-bold" data-i18n="locations.label_time"></p>
                                <p class="text-white" data-i18n="locations.time_sz"></p>
                            </div>
                        </div>
                        <div class="flex items-start gap-6">
                            <i class="fas fa-location-dot text-gold text-xl w-6 mt-1"></i>
                            <div>
                                <p class="text-xs uppercase tracking-widest text-gray-500 font-bold" data-i18n="locations.label_place"></p>
                                <p class="text-white font-medium" data-i18n="locations.place_sz_name"></p>
                                <p class="text-gray-500 text-sm italic" data-i18n="locations.place_sz_addr"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="lg:w-1/2 w-full h-[500px] map-wrapper relative">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2944.3414467006883!2d25.641697276587625!3d42.420448931185565!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40a869751c4a6901%3A0x6d1452f1d0924437!2z0J3Rh9C60L7Qu9C-INC_0L7Qu9C40YLRgdC60LgsINCx0YPQuy4g4ptmFwdWwg0KHQuNC80LXQvtC9INCS0LXQu9C40LrQuOKAnSBCbHZkIDE1NiwgNjAwMSDQodGC0LDRgNCwINCX0LDQs9C-0YDQsA!5e0!3m2!1sbg!2sbg!4v1710000000000" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" class="relative z-0">
                    </iframe>
                    <div class="absolute inset-0 map-overlay"></div>
                </div>
            </div>

            <div class="flex flex-col lg:flex-row-reverse gap-16 items-center">
                <div class="lg:w-1/2">
                    <div class="w-12 h-1 bg-gold mb-8 lg:ml-auto"></div>
                    <div class="lg:text-right">
                        <h2 class="text-4xl font-bold text-white mb-6 tracking-tight" data-i18n="locations.sf_title"></h2>
                        <p class="text-gray-400 text-lg mb-8 leading-relaxed ml-auto max-w-md" data-i18n="locations.sf_desc"></p>
                        <div class="space-y-6 inline-block text-left">
                            <div class="flex items-center gap-6">
                                <i class="fas fa-calendar-check text-gold text-xl w-6"></i>
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-gray-500 font-bold" data-i18n="locations.label_freq"></p>
                                    <p class="text-white" data-i18n="locations.freq_sf"></p>
                                </div>
                            </div>
                            <div class="flex items-start gap-6">
                                <i class="fas fa-map-marker-alt text-gold text-xl w-6 mt-1"></i>
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-gray-500 font-bold" data-i18n="locations.label_place"></p>
                                    <p class="text-white font-medium italic" data-i18n="locations.sf_status"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="lg:w-1/2 w-full h-[500px] map-wrapper relative">
                    <div class="relative w-full h-full bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/5 group overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-tr from-gold/5 to-transparent opacity-50"></div>
                        <div class="relative z-10 text-center px-6">
                            <i class="fas fa-map-marker-slash text-gold/40 text-4xl mb-4 block"></i>
                            <h4 class="text-white font-bold uppercase tracking-widest text-sm mb-2" data-i18n="locations.sf_title"></h4>
                            <p class="text-gray-500 text-xs italic tracking-wide" data-i18n="locations.sf_map_placeholder"></p>
                        </div>
                        <div class="absolute inset-0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/5 to-transparent"></div>
                    </div>
                    <div class="absolute inset-0 map-overlay"></div>
                </div>
            </div>

        </div>

        <div class="mt-40 p-16 bg-gradient-to-br from-zinc-900 to-black border border-gold/20 text-center relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                <i class="fas fa-lion text-9xl text-gold"></i>
            </div>
            <h3 class="text-3xl font-bold text-white mb-6 uppercase tracking-tight" data-i18n="locations.cta_title"></h3>
            <p class="text-gray-400 max-w-2xl mx-auto mb-10 text-lg" data-i18n="locations.cta_desc"></p>
            <a href="index.html#join" class="btn bg-gold border-gold text-black hover:bg-white hover:border-white px-12 btn-lg rounded-none uppercase tracking-widest text-xs font-bold transition-all" data-i18n="locations.cta_btn"></a>
        </div>
    </div>
</section>

<footer class="py-20 bg-black text-center border-t border-white/5">
    <p class="text-[10px] tracking-[0.4em] text-gray-600 uppercase" data-i18n="index.footer_text"></p>
    <ul>
        <li>
            <button onclick="switchLanguage()" class="text-[10px] tracking-[0.3em] text-gray-600 uppercase hover:text-gold" data-i18n="index.nav_lang"></button>
        </li>
    </ul>
</footer>

<script>
function switchLanguage() {
    const isEnPath = window.location.pathname.includes('/en/');

    if (isEnPath)
        window.location.href = window.location.origin + '/' + window.location.pathname.substring(window.location.pathname.lastIndexOf('/') + 1);
    else
        window.location.href = window.location.origin + '/en/' + window.location.pathname.substring(window.location.pathname.lastIndexOf('/') + 1);
}

async function loadTranslations(lang) {
    try {
        const isEnPath = window.location.pathname.includes('/en/');
        const jsonPath = isEnPath ? '../lang/' : './lang/';

        const response = await fetch(`${jsonPath}${lang}.json`);
        if (!response.ok) throw new Error('Файлът не е намерен');
        const translations = await response.json();

        const getNestedValue = (obj, path) => {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        };

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const keyPath = el.dataset.i18n;
            const translation = getNestedValue(translations, keyPath);
            if (translation) el.textContent = translation;
        });

        const docTitle = getNestedValue(translations, "locations.title");
        if (docTitle) document.title = docTitle;

    } catch (error) {
        console.error("Грешка при превода:", error);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const currentLang = window.location.pathname.includes('/en/') ? 'en' : 'bg';
    loadTranslations(currentLang);
});
</script>

</body>
</html>
